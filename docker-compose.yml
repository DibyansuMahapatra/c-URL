services:

  postgres:
    image: postgres:16
    container_name: compacturl-postgres

    environment:
      POSTGRES_DB: c_url
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres@1
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - compact-network

  redis:
    image: redis:7
    container_name: compacturl-redis

    ports:
      - "6379:6379"

    networks:
      - compact-network

  app:
    image: dibyansumahapatra/compacturl:latest
    container_name: compacturl-app

    ports:
      - "8080:8080"

    depends_on:
      - postgres
      - redis

    networks:
      - compact-network

volumes:
  postgres_data:

networks:
  compact-network:
    driver: bridge